<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت مالی و ثروت (WealthPulse)</title>
    <script>
      // Suppress benign Vite HMR WebSocket connection errors in sandbox container
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event.reason && (event.reason.message || event.reason);
        if (msg && typeof msg === 'string' && msg.includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
